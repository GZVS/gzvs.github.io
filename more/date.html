
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laura, say yes?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#193b28;background:#f4f5e9}*{box-sizing:border-box}body{margin:0;min-height:100svh}button{font:inherit}header{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:26px 36px;pointer-events:none;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.brand{font-size:17px;letter-spacing:-.5px;text-transform:none}.brand span{color:#e4797f}header .note{font-size:10px}.field{min-height:100svh;display:grid;grid-template-columns:repeat(8,1fr);gap:14px;padding:90px 30px 70px;align-content:space-between}.yes{border:1px solid #3e80513d;border-radius:100px;padding:20px 8px;min-height:68px;background:#d9e9cb;color:#285739;cursor:pointer;font-size:20px;font-weight:600;transition:transform .2s,background .2s,box-shadow .2s}.yes:nth-child(5n+1){background:#426e45;color:#fff}.yes:nth-child(5n+2){background:#b8d69d}.yes:nth-child(5n+3){background:#e6edda}.yes:nth-child(5n+4){background:#83ad72;color:#183c28}.yes:hover{transform:rotate(-5deg) scale(1.07);background:#254d31;color:white;box-shadow:0 5px 20px #214c3020}.yes:focus-visible,.no:focus-visible,.close:focus-visible{outline:3px solid #cf6c79;outline-offset:4px}.question{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,90vw);text-align:center;background:#f9f8ed;border:1px solid #ced6bc;border-radius:28px;padding:35px 40px 30px;box-shadow:0 12px 70px 25px #f4f5e9c9}.eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;margin:0 0 15px}.heart{color:#d6797e;font-size:28px;display:block;margin-bottom:12px}h1{font-size:clamp(29px,3.9vw,49px);font-weight:600;line-height:1.17;letter-spacing:-2px;margin:0}h1 em{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:#547b43;font-size:1.25em}.subtitle{color:#71816a;font-size:12px;margin:20px 0 22px}.no-wrap{position:relative;display:inline-block}.no{border:1px solid #cd666c;border-radius:30px;background:#e77f85;color:#fff;font-size:12px;font-weight:700;padding:11px 29px;cursor:not-allowed}.tooltip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);background:#263b2b;color:#fff;padding:10px 14px;border-radius:9px;white-space:nowrap;font-size:12px;opacity:0;visibility:hidden;transition:.15s;pointer-events:none;box-shadow:0 4px 20px #0002}.no-wrap:hover .tooltip,.no-wrap:focus-within .tooltip,.no-wrap.show .tooltip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}footer{position:fixed;bottom:22px;left:0;right:0;text-align:center;z-index:3;font-size:10px;letter-spacing:1.6px;color:#56734d;pointer-events:none}.dot{padding:0 12px;color:#a5b596}dialog{border:1px solid #c8d7ba;border-radius:28px;text-align:center;color:#234630;background:#f9f8ed;padding:45px 30px;width:min(440px,90vw);box-shadow:0 20px 100px #17391d35}dialog::backdrop{background:#1c382b66;backdrop-filter:blur(7px)}dialog h2{font-family:'Playfair Display',Georgia,serif;font-size:46px;margin:0 0 15px}dialog p{font-size:14px;color:#6a7c5f}.close{border:0;background:#426e45;color:white;border-radius:25px;padding:12px 25px;cursor:pointer;margin-top:12px}.confetti{position:fixed;pointer-events:none;z-index:10;top:-30px;animation:fall 3s ease-in forwards;font-size:22px}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}@media(max-width:700px){header{padding:23px 20px}header .note{font-size:8px;letter-spacing:1px}.field{grid-template-columns:repeat(5,1fr);gap:10px;padding:85px 14px 65px}.yes{min-height:57px;padding:14px 2px;font-size:16px}.question{padding:28px 20px;width:88vw;border-radius:23px}h1{letter-spacing:-1px}.subtitle{font-size:11px}footer{font-size:8px;letter-spacing:1px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.confetti{display:none}}
</style></head>
<body>
<header><div class="brand">a little question<span> ♥</span></div><div class="note">One question. So many ways to say yes.</div></header>
<main><div class="field" id="field" aria-label="Say yes in a European language"></div>
<section class="question" aria-labelledby="question"><span class="heart" aria-hidden="true">♡</span><p class="eyebrow">THIS ONE'S FOR YOU</p><h1 id="question">LAURA WILL U GO<br>ON A <em>DATE</em><br>WITH ME ?</h1><p class="subtitle">Pick a yes. Any yes. They all mean the same thing.</p><div class="no-wrap" id="noWrap"><button class="no" id="no" type="button" aria-disabled="true" aria-describedby="noMessage">NO</button><span class="tooltip" id="noMessage" role="tooltip">This button cannot be clicked</span></div></section></main>
<footer>A LITTLE COURAGE<span class="dot">·</span>A LOT OF YES<span class="dot">·</span>JUST FOR LAURA</footer>
<dialog id="celebration" aria-labelledby="yay"><span class="heart" aria-hidden="true">♥</span><h2 id="yay">It's a date!</h2><p>You just made my day, Laura.</p><button class="close" type="button">Can't wait ♡</button></dialog>
<script>
const words=[['yes','English'],['da','Romanian'],['sí','Spanish'],['oui','French'],['ja','German'],['sì','Italian'],['ναι','Greek'],['sim','Portuguese'],['tak','Polish'],['да','Bulgarian'],['igen','Hungarian'],['ano','Czech'],['áno','Slovak'],['po','Albanian'],['kyllä','Finnish'],['jah','Estonian'],['jā','Latvian'],['taip','Lithuanian'],['já','Icelandic'],['iva','Maltese'],['ie','Welsh'],['bai','Basque'],['si','Galician'],['sí','Catalan'],['да','Serbian'],['da','Croatian'],['ja','Dutch'],['ja','Swedish'],['ja','Danish'],['ja','Norwegian'],['так','Ukrainian'],['да','Macedonian'],['да','Russian'],['так','Belarusian'],['evet','Turkish'],['hai','Romani'],['gea','Northern Sámi'],['sim','Portuguese'],['da','Slovenian'],['sì','Sardinian'],['jes','Esperanto'],['sì','Corsican'],['da','Bosnian'],['oui','French'],['yes','English'],['ναι','Greek'],['sí','Spanish'],['ja','German']];
const field=document.querySelector('#field'),modal=document.querySelector('dialog');
words.forEach(([word,language])=>{const button=document.createElement('button');button.className='yes';button.type='button';button.textContent=word;button.title=language;button.setAttribute('aria-label',`Yes in ${language}: ${word}`);button.addEventListener('click',()=>{modal.showModal();for(let i=0;i<28;i++){const bit=document.createElement('span');bit.className='confetti';bit.textContent=i%3?'♥':'✦';bit.style.left=Math.random()*100+'vw';bit.style.color=['#e77f85','#426e45','#a4c27d'][i%3];bit.style.animationDelay=Math.random()*.6+'s';document.body.append(bit);setTimeout(()=>bit.remove(),4000)}});field.append(button)});
const no=document.querySelector('#no'),wrap=document.querySelector('#noWrap');no.addEventListener('click',event=>{event.preventDefault();wrap.classList.add('show');setTimeout(()=>wrap.classList.remove('show'),2400)});document.querySelector('.close').addEventListener('click',()=>modal.close());
</script></body></html>
